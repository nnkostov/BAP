name: CI

on:
  push:
    branches: [ main, master, 'devin/**' ]
  pull_request:
    branches: [ main, master ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore BAP.sln

      - name: Build
        run: dotnet build BAP.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BAP.sln --configuration Release --no-build --verbosity normal

  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: BAP-win-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: BAP-osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: BAP-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: >
          dotnet publish src/BAP.Desktop/BAP.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/
          retention-days: 30
